version: 1

repository:
  name: Partrunner-ai/partrunner-platform
  # No separate staging branch. main is both.
  integration_branch: main
  production_branch: main

pull_requests:
  feature_base: main
  feature_merge: squash
  never: [merge, rebase]
  promotion: none

context:
  file: CONTEXT.md
  instructions: AGENTS.md
  claude_adapter: CLAUDE.md

verification:
  - pnpm install --frozen-lockfile
  - pnpm build
  - pnpm packages:check
  - pnpm typecheck
  - pnpm lint
  - pnpm test
  - pnpm test:browser

review:
  human:
    requirement: required
    enforcement: advisory_in_pilot
  agent:
    change_review: required
    architecture_for:
      - cross_repository
      - auth_or_permissions
      - shared_database_contract
      - finance_or_audit
      - irreversible_data_change
      - long_lived_platform_seam
    enforcement: advisory_in_pilot

database_changes: []

deployment:
  # Packages are the production artifact.
  kind: package_registry
  provider: npmjs
  review_surface:
    kind: static_showcase
    provider: vercel
    path: packages/showcase
    data: fixtures_only

release:
  versioning: semver_from_1_0
  trusted_publishing: github_oidc
  environment: npm
  enable_variable: NPM_RELEASE_ENABLED
  major: Renaming or removing a prop, dropping a variant, or changing what a --pr-* variable means.
  minor: A new variant, token, or component.
  note: >-
    A minor reaches every consuming app on its next install. That reach is the
    point of the library and the reason an accidental behaviour change is
    fleet-wide.

docs_only:
  # Qualified docs-only changes (root AGENTS/CLAUDE/CONTEXT/README.md and
  # docs/**/*.md only) take this bounded lane instead of the full verification
  # list above. Every other change keeps the normal gates. The lane never skips
  # its own classifier, policy-validator or preview-helper tests. A policy change
  # is never docs-only, and the manifest is validated by
  # scripts/ci/validate-repo-policy.py (PyYAML, duplicate keys rejected).
  lane: scripts/ci/docs-only.mjs
  validation:
    - node --test scripts/ci/docs-only.test.mjs
    - node --test scripts/ci/repo-policy.test.mjs
  policy: scripts/ci/validate-repo-policy.py
  preview: scripts/ci/should-deploy-preview.mjs
  limit: >-
    The CI build check stays required; only Vercel preview builds are skipped, because no protected aggregate check exists to accept a skipped build.
