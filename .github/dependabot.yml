version: 2
updates:
  # One npm entry at the root: pnpm uses the root pnpm-lock.yaml for all packages/*.
  # An update made from the root changes the package manifest and the lockfile together.
  # Not confirmed by the GitHub docs: that this entry stops a security PR made from a
  # package folder (manifest only, no lockfile). If one arrives, close it; the root PR is the good one.
  - package-ecosystem: npm
    directory: /
    # Version updates: minor and patch versions only, in two grouped pull requests each week,
    # one for development dependencies and one for production dependencies.
    # Security updates do not follow this schedule (they have their own fixed limit of 10 open PRs).
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    # A release must be 7 days old before a version update proposes it. Security updates do not wait.
    cooldown:
      default-days: 7
    # Keep a version range that already allows the new release: then only the lockfile changes.
    # The GitHub docs mark this option for security updates too: a security fix inside the
    # current range changes only the lockfile, and the published package keeps its range.
    versioning-strategy: increase-if-necessary
    groups:
      # Group security alerts into one PR where Dependabot allows it.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # packages:published-check accepts a change of only devDependencies in a published package.
      # If this PR fails that check, an update changed the built files (a build tool, for example):
      # add a Changeset to the PR, or do that update by hand.
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      # A change of the dependencies of a published package always needs a Changeset.
      # With the strategy above, most of these updates change only the lockfile.
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
    # No automatic version update for these. The rules do not change security updates: for a
    # security update Dependabot uses only the `versions` list of an ignore rule, and these rules
    # have none (dependabot-core, common/lib/dependabot/config/ignore_condition.rb).
    # The GitHub docs say that `ignore` can apply to security updates too, and do not say what
    # `update-types` does there.
    ignore:
      # Major versions: do them by hand.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # The tokens package ships the font files of these packages (packages/tokens/src/emit.ts),
      # so a new version always changes the published files. Update them by hand, with a Changeset.
      - dependency-name: "@fontsource/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Workflow action versions: one grouped PR each week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
