name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Resolves the pushed range (`github.event.before`) or the pull request merge
  # base and decides whether the change is docs-only. The `build` check is still
  # required and always runs: this repository has no aggregate check that could
  # accept a skipped required job, so the lane is limited to preview builds and
  # validation. See docs/ci-qa.md.
  docs-only:
    name: docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.flags.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Classify docs-only change
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: node scripts/ci/docs-only.mjs --flags

      - name: Install pinned policy validator
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          -r scripts/ci/requirements-ci.txt

      - name: Validate repository policy
        run: python3 scripts/ci/validate-repo-policy.py .partrunner/repo-policy.yml

      # The classifier, validator and preview helper are code: they run on every
      # run that reaches this job, including the docs-only lane they protect.
      - name: Test docs-only classifier
        run: >-
          node --test scripts/ci/docs-only.test.mjs
          scripts/ci/repo-policy.test.mjs
          scripts/ci/should-deploy-preview.test.mjs
          scripts/ci/workflow-contract.test.mjs

  build:
    needs: docs-only
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require docs and policy validation
        env:
          DOCS_RESULT: ${{ needs.docs-only.result }}
        run: |
          if [ "$DOCS_RESULT" != "success" ]; then
            echo "::error::Docs/policy validation did not succeed."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify publishable package artifacts
        run: pnpm packages:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
